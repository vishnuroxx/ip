plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for unit tests
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JavaFX 17 for the GUI (see se-education.org JavaFX tutorial parts 1-5).
    // Every OS classifier is listed so the project still builds and runs on a
    // machine whose JDK does not bundle JavaFX; ':mac-aarch64' covers Apple Silicon.
    String javaFxVersion = '17.0.7'
    List<String> javaFxPlatforms = ['win', 'mac', 'mac-aarch64', 'linux']
    List<String> javaFxModules = ['javafx-base', 'javafx-controls', 'javafx-fxml', 'javafx-graphics']
    javaFxModules.each { module ->
        javaFxPlatforms.each { platform ->
            implementation("org.openjfx:${module}:${javaFxVersion}:${platform}")
        }
    }
}

java {
    // Java 25 matches the course toolchain; the Azul "FX" build of JDK 25 also
    // bundles the JavaFX runtime, which the GUI needs (see AGENTS.md).
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // The GUI is the default entry point; the text CLI still runs via hu9o.Hu9o.
    mainClass = 'hu9o.gui.Launcher'
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")

}

// Builds a single self-contained "fat" JAR at build/libs/hu9o.jar that bundles
// every runtime dependency, so it can be launched with `java -jar` on any
// machine that has a JRE. Shadow reads Main-Class from `application.mainClass`.
shadowJar {
    archiveBaseName = 'hu9o'
    archiveClassifier = ''   // drop the default "-all" suffix
    archiveVersion = ''      // drop the version number from the file name
}

test {
    useJUnitPlatform()

    // Print each test method to the console as it runs, instead of only
    // writing the HTML report. 'failed' also prints the assertion mismatch.
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

run {
    standardInput = System.in
}