plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for unit tests
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }   
}

application {
    mainClass = 'hu9o.Hu9o'
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")

}

// Builds a single self-contained "fat" JAR at build/libs/hu9o.jar that bundles
// every runtime dependency, so it can be launched with `java -jar` on any
// machine that has a JRE. Shadow reads Main-Class from `application.mainClass`.
shadowJar {
    archiveBaseName = 'hu9o'
    archiveClassifier = ''   // drop the default "-all" suffix
    archiveVersion = ''      // drop the version number from the file name
}

test {
    useJUnitPlatform()

    // Print each test method to the console as it runs, instead of only
    // writing the HTML report. 'failed' also prints the assertion mismatch.
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

run {
    standardInput = System.in
}